[workspace]
resolver = "2"
members = ["crates/core", "crates/ssh", "crates/relay", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
tracing = "0.1"
lt-core = { path = "crates/core" }
lt-ssh = { path = "crates/ssh" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
